name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. paths-filter needs pull-requests:read to list PR files via the API;
# the repo's default token only grants contents:read.
permissions:
  contents: read
  pull-requests: read

# PRs: a new push supersedes the old run. main: never cancel — every merge must build everything
# (two quick merges once cancelled the first build and skipped the client in the second).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # Path filtering only for PRs; a push to main always builds everything.
    outputs:
      server: ${{ github.event_name == 'push' || steps.f.outputs.server == 'true' }}
      client: ${{ github.event_name == 'push' || steps.f.outputs.client == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build with dead-code analyzers (TEMPORARY)
        shell: pwsh
        run: dotnet build client/Vigil.sln -c Release -clp:Summary -nologo -p:Version=0.0.0-review
      - name: Vulnerable packages
        shell: pwsh
        run: dotnet list client/Vigil.sln package --vulnerable --include-transitive
      - name: Outdated packages
        shell: pwsh
        run: dotnet list client/Vigil.sln package --outdated
