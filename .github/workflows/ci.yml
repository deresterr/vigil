name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. paths-filter needs pull-requests:read to list PR files via the API;
# the repo's default token only grants contents:read.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.f.outputs.server }}
      client: ${{ steps.f.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - 'installer/**'
              - 'build-package.ps1'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t vigil-server:ci .

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build package
        shell: pwsh
        run: ./build-package.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-client-${{ github.sha }}
          path: dist/
          retention-days: 14
