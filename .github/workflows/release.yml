name: release

# A tag v* (e.g. v0.7.0) publishes:
#   - the server image to GHCR: ghcr.io/<owner>/vigil-server:<version> and :latest
#   - the client package, one file (#76): vigil_setup.exe as an asset of a GitHub release for that tag
#     (always the same name: .../releases/latest/download/vigil_setup.exe is the newest client)
# Tags are pushed from a terminal or created in the GitHub UI (Releases -> Draft a new release ->
# choose a tag): the workflow then attaches vigil_setup.exe to that release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests before publishing
        working-directory: server
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          pytest -q
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/vigil-server"
          version="${GITHUB_REF_NAME#v}"
          docker build -t "${image}:${version}" -t "${image}:latest" \
            --build-arg "VIGIL_VERSION=${version}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${version}" server
          docker push "${image}:${version}"
          docker push "${image}:latest"

  client-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build package
        shell: pwsh
        # The binaries carry the tag's version without the "v" (vigil_setup compares installed and package).
        run: ./build-package.ps1 -Configuration Release -Version ('${{ github.ref_name }}'.TrimStart('v'))
      # Only a hand-over to the release job, which attaches dist/vigil_setup.exe to the release.
      - uses: actions/upload-artifact@v7
        with:
          name: vigil-client-${{ github.ref_name }}
          path: dist/
          retention-days: 1

  release:
    needs: [server-image, client-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vigil-client-${{ github.ref_name }}
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          notes="Server: \`ghcr.io/${owner}/vigil-server:${TAG#v}\` (in \`server/.env\`: \`VIGIL_IMAGE=\`). Client: \`vigil_setup.exe\` (the whole client in one file; run it on the child's PC)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/vigil_setup.exe --clobber
          else
            gh release create "$TAG" dist/vigil_setup.exe --title "Vigil ${TAG}" --notes "$notes" --generate-notes
          fi
