<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t">
  <title id="t">Jak działa Vigil: panel rodzica i usługi na PC dziecka rozmawiają z jednym serwerem</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8e8e8; }
    .zone { font-size: 12px; font-weight: 600; letter-spacing: .08em; fill: #9ca3af; }
    .title { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13.5px; fill: #9ca3af; }
    .lbl { font-size: 13px; fill: #c4c8cf; }
    .note { font-size: 13.5px; fill: #c4c8cf; }
    .box { fill: #232323; stroke: #3a3a3a; stroke-width: 1.5; }
    .zonebox { fill: none; stroke: #333; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>

  <rect width="900" height="430" rx="14" fill="#1a1a1a"/>

  <!-- Parent -->
  <rect class="zonebox" x="8" y="22" width="200" height="200" rx="12"/>
  <text class="zone" x="24" y="44">RODZIC</text>
  <rect class="box" x="24" y="62" width="168" height="104" rx="10"/>
  <text class="title" x="40" y="92">Rodzic</text>
  <text class="sub" x="40" y="118">panel w przeglądarce</text>
  <text class="sub" x="40" y="140">TOTP w telefonie</text>

  <!-- Home server -->
  <rect class="zonebox" x="300" y="22" width="248" height="200" rx="12"/>
  <text class="zone" x="316" y="44">SERWER DOMOWY · DOCKER</text>
  <rect class="box" x="316" y="62" width="216" height="144" rx="10"/>
  <text class="title" x="332" y="92">Serwer Vigil</text>
  <text class="sub" x="332" y="114">FastAPI + SQLite</text>
  <text class="sub" x="332" y="142">liczy czas każdego dziecka</text>
  <text class="sub" x="332" y="162">ze wszystkich jego PC</text>
  <text class="sub" x="332" y="188">decyduje o blokadzie</text>

  <!-- Child's PC -->
  <rect class="zonebox" x="636" y="22" width="248" height="392" rx="12"/>
  <text class="zone" x="652" y="44">PC DZIECKA · WINDOWS 10/11</text>
  <rect class="box" x="652" y="62" width="186" height="78" rx="10"/>
  <text class="title" x="668" y="92">vigil_watchdog</text>
  <text class="sub" x="668" y="116">usługa Windows</text>

  <rect class="box" x="652" y="196" width="186" height="78" rx="10"/>
  <text class="title" x="668" y="226">vigil_ui</text>
  <text class="sub" x="668" y="250">zasobnik + ekran blokady</text>

  <rect class="box" x="652" y="320" width="186" height="78" rx="10"/>
  <text class="title" x="668" y="350">Vigil Guardian</text>
  <text class="sub" x="668" y="374">zadanie co 5 min</text>

  <!-- Parent → server -->
  <line x1="192" y1="122" x2="314" y2="122" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>
  <text class="lbl" x="206" y="74">limity,</text>
  <text class="lbl" x="206" y="92">dodatkowy czas,</text>
  <text class="lbl" x="206" y="110">blokada</text>

  <!-- Watchdog ⇄ server -->
  <line x1="652" y1="88" x2="534" y2="88" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <text class="lbl" x="560" y="78">heartbeat</text>
  <line x1="534" y1="116" x2="650" y2="116" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <text class="lbl" x="552" y="138">czy blokować</text>

  <!-- Watchdog ⇄ vigil_ui -->
  <line x1="745" y1="142" x2="745" y2="194" stroke="#9ca3af" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="756" y="173">nazwany potok</text>

  <!-- Guardian → watchdog -->
  <path d="M838 359 H862 V101 H840" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ao)"/>
  <text class="lbl" x="876" y="230" transform="rotate(90 876 230)" text-anchor="middle" style="fill:#fb923c">naprawy</text>

  <!-- Parent's TOTP code → lock screen -->
  <path d="M108 166 V235 H650" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text class="lbl" x="124" y="258" style="fill:#4ade80">kod TOTP wpisany na ekranie blokady, także offline</text>

  <!-- Rules -->
  <text class="note" x="24" y="322">• Brak odpowiedzi serwera przez 30 s: PC się blokuje.</text>
  <text class="note" x="24" y="348">• Kolejność: ręczna › cisza nocna › limit › pauza.</text>
  <text class="note" x="24" y="374">• Każda naprawa i manipulacja: alert w Dzienniku.</text>
</svg>
