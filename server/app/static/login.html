<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil</title>
  <!-- theme -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--hover);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 32px;
      width: 360px;
      max-width: 90vw;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 1.4rem;
      font-weight: 500;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-2);
    }
    input[type=password] {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 4px;
      font-size: 1rem;
    }
    input[type=password]:focus {
      outline: none;
      border-color: var(--accent-line);
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 4px;
      color: var(--danger-text);
      font-size: 0.9rem;
    }
    .error[hidden] { display: none; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <h1>Vigil</h1>
    <label for="password" data-i18n>Hasło rodzica</label>
    <input type="password" id="password" name="password" autofocus required>
    <div id="error" class="error" hidden data-i18n>Nieprawidłowe hasło.</div>
    <button type="submit" data-i18n>Zaloguj</button>
  </form>
  <!-- i18n -->
  <script>
    applyI18n();
    const q = new URLSearchParams(location.search);
    const err = document.getElementById("error");
    if (q.get("error") === "1") {
      err.hidden = false;
    } else if (q.get("error") === "locked") {
      const wait = parseInt(q.get("wait") || "0", 10);
      err.textContent = t('Zbyt wiele nieudanych prób. Spróbuj ponownie za {time}.',
                          {time: wait >= 60 ? Math.ceil(wait / 60) + " min" : wait + " s"});
      err.hidden = false;
    }
  </script>
</body>
</html>
