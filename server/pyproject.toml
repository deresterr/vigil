# Tooling config only. Runtime deps: requirements.txt (used by the Dockerfile).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# B008: FastAPI Depends() in defaults is idiomatic. UP017: datetime.UTC churn, not worth it.
ignore = ["B008", "UP017"]
